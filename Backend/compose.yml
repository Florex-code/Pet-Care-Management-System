services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pawcare
      POSTGRES_USER: pawcare
      POSTGRES_PASSWORD: pawcare
    ports:
      - "5432:5432"
    volumes:
      - pawcare-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawcare -d pawcare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pawcare-postgres:
